<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Greetings</title>
    
    <style>

        
        body{
    font-variant-caps: all-petite-caps;
    background-color: #121212;
    color: #FFFFFF;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.widget {
    padding: 20px;
    color: #FFFFFF;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    max-width: 95%;
    margin: auto;
    background-color: #1e1e1e;
    border: 3px solid #444444;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
}

.greet{
    font-size: 3em;
    color: #ffffff;
}

.date {
    font-family: monospace;
    font-size: 2em;
    color: #bdbdbd;
}

.clock {
    font-family: monospace;
    font-size: 2em;
    color: #4ade80;
}

.time {
    display: inline-block;
    min-width: 20px;
}

.colon {
    font-size: 1em;
    display: inline-block;
    color: #4ade80;
}

        



    </style>
</head>
<body>




<div class="container">
    <div class="widget">

            <div class="greet" id="greet"></div>

                <div class="date" id="date"></div>
                <div class="clock">
                    <div class="time" id="hour"></div>
                    <div class="colon">:</div>
                    <div class="time" id="min"></div>
                    <div class="colon">:</div>
                    <div class="time" id="sec"></div>
                </div>
           

        

    </div>
</div>
        

    
<script>
function dispalyGreetings(today) {
    let hrs = today.getHours();
    let name = "N&D";
    let greet;

    if (hrs < 12)
        greet = "Good Morning " + name;
    else if (hrs < 18)
        greet = "Good Afternoon " + name;
    else
        greet = "Good Evening " + name;

    document.getElementById("greet").innerHTML = greet;
}

function dispalyDate(today) {
    const days = [
        "Sunday", "Monday", "Tuesday", "Wednesday",
        "Thursday", "Friday", "Saturday"
    ];

    const monthNames = [
        "January", "February", "March", "April",
        "May", "June", "July", "August",
        "September", "October", "November", "December"
    ];

    let dayName = days[today.getDay()];
    let monthName = monthNames[today.getMonth()];
    let date = today.getDate();
    let year = today.getFullYear();

    document.getElementById("date").innerHTML =
        dayName + ", " + monthName + " " + date + " " + year;
}

function dispalyClock(today) {
    let hour = padZeros(twelveHour(today.getHours()));
    let minutes = padZeros(today.getMinutes());
    let seconds = padZeros(today.getSeconds());

    seconds += today.getHours() >= 12 ? " pm" : " am";

    document.getElementById("hour").innerHTML = hour;
    document.getElementById("min").innerHTML = minutes;
    document.getElementById("sec").innerHTML = seconds;
}

function twelveHour(hour) {
    if (hour > 12) {
        return hour - 12;
    } else if (hour === 0) {
        return 12;
    }
    return hour;
}

function padZeros(num) {
    return num < 10 ? "0" + num : num;
}

function dispalyWidget() {
    let today = new Date();

    displayGreetings(today);
    displayDate(today);
    displayClock(today);

    setTimeout(dispalyWidget, 500);
}

window.onload = dispalyWidget;
</script>


</body>
</html>
